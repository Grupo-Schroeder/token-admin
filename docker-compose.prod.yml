
name: token-admin

services:
  app:
    image: token-admin:production
    build:
      context: .
      dockerfile: Docker/php/Dockerfile

    container_name: token-admin-app
    restart: unless-stopped
    working_dir: /app

    environment:
      APP_NAME: "${APP_NAME:-Token Admin}"
      APP_ENV: production
      APP_KEY: "${APP_KEY:?Set APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:?Set APP_URL}"
      APP_LOCALE: "${APP_LOCALE:-es}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-es}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-warning}"

      DB_CONNECTION: pgsql
      SESSION_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-token_admin}"
      DB_USERNAME: "${DB_USERNAME:-token_admin}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"

      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI}"

    volumes:
      - app_storage:/app/storage

    networks:
      - internal
      - traefik-public

    depends_on:
      db:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    cpus: 1.00

    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1/up') !== false ? 0 : 1);"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.token-admin.rule=Host(`token-admin.test.lebensalud.com`)"
      - "traefik.http.routers.token-admin.entrypoints=websecure"
      - "traefik.http.routers.token-admin.tls=true"
      - "traefik.http.services.token-admin.loadbalancer.server.port=80"

  db:
    image: postgres:17-alpine
    container_name: token-admin-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${DB_DATABASE:-token_admin}"
      POSTGRES_USER: "${DB_USERNAME:-token_admin}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - internal

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    security_opt:
      - no-new-privileges:true

    mem_limit: 768m
    cpus: 1.00

volumes:
  app_storage:
  postgres_data:

networks:
  internal:
    driver: bridge
    internal: true

  traefik-public:
    external: true

