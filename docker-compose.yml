services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: token-admin-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Token Admin"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      DB_CONNECTION: pgsql
      SESSION_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-token_admin}"
      DB_USERNAME: "${DB_USERNAME:-token_admin}"
      DB_PASSWORD: "${DB_PASSWORD:-change_me_before_use}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
    command: >
      sh -lc "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs &&
      composer install --no-interaction --prefer-dist &&
      php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:17-alpine
    container_name: token-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-token_admin}"
      POSTGRES_USER: "${DB_USERNAME:-token_admin}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change_me_before_use}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-token_admin} -d ${DB_DATABASE:-token_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  app_storage:


