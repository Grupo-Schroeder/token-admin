
services:
  app:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
    container_name: token-admin-app
    ports:
      - "8000:80"
    volumes:
      - .:/app
      - vendor:/app/vendor
      - app_storage:/app/storage
    environment:
      APP_NAME: "Token Admin"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      DB_CONNECTION: pgsql
      SESSION_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-token_admin}"
      DB_USERNAME: "${DB_USERNAME:-token_admin}"
      DB_PASSWORD: "${DB_PASSWORD:-change_me_before_use}"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1/up') !== false ? 0 : 1);"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 4
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: token-admin-db
    environment:
      POSTGRES_DB: "${DB_DATABASE:-token_admin}"
      POSTGRES_USER: "${DB_USERNAME:-token_admin}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change_me_before_use}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  vendor:
  postgres_data:
  app_storage:

